apiVersion: v1
kind: Service
metadata:
  name: {{ include "devapp.fullname" . }}-business-app
  labels:
  {{- include "devapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.businessApp.type }}
  selector:
    app: business-app
    {{- include "devapp.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.businessApp.ports | toYaml | nindent 2 }}